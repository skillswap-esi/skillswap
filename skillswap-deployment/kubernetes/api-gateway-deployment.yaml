apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: skillswap
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: skillswap/api-gateway:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: SPRING_PROFILES_ACTIVE
          valueFrom:
            configMapKeyRef:
              name: skillswap-config
              key: SPRING_PROFILES_ACTIVE
        - name: USER_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: skillswap-config
              key: USER_SERVICE_URL
        - name: SKILL_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: skillswap-config
              key: SKILL_SERVICE_URL
        - name: MISSION_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: skillswap-config
              key: MISSION_SERVICE_URL
        - name: NOTIFICATION_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: skillswap-config
              key: NOTIFICATION_SERVICE_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: skillswap-secrets
              key: JWT_SECRET
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: skillswap
spec:
  selector:
    app: api-gateway
  ports:
  - port: 8080
    targetPort: 8080
  type: LoadBalancer
