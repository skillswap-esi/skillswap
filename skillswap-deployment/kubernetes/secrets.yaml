apiVersion: v1
kind: Secret
metadata:
  name: skillswap-secrets
  namespace: skillswap
type: Opaque
stringData:
  # PostgreSQL Credentials
  POSTGRES_USER: "skillswap_user"
  POSTGRES_PASSWORD: "skillswap_password"
  
  # MongoDB Credentials
  MONGODB_USERNAME: "skillswap_user"
  MONGODB_PASSWORD: "skillswap_password"
  
  # JWT Secret
  JWT_SECRET: "your-secret-key-change-in-production"
  
  # Firebase Admin SDK (base64 encoded)
  FIREBASE_SERVICE_ACCOUNT: ""
