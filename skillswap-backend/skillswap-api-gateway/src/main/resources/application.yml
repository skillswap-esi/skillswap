server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**, /api/auth/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}

        - id: skill-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/skills/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}

        - id: mission-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/missions/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}

        - id: notification-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/notifications/**
          filters:
            - RewritePath=/api/(?<segment>.*), /${segment}

      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

jwt:
  secret: skillswap-secret-key-change-this-in-production
  expiration: 86400000

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
